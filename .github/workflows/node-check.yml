name: Node checks
on:
  push:
    branches: [main, feature/sicoob-pix-integration]
  pull_request:
    branches: [main]
jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Check JavaScript syntax
        shell: bash
        run: |
          status=0
          : > syntax-results.txt
          while IFS= read -r -d '' file; do
            echo "Checking $file" | tee -a syntax-results.txt
            if ! node --check "$file" >> syntax-results.txt 2>&1; then
              status=1
            fi
          done < <(find src -name '*.js' -print0)
          cat syntax-results.txt
          exit "$status"
      - name: Upload syntax report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: node-syntax-report
          path: backend/syntax-results.txt
